name: Mesas al aire
on:
  schedule:
    # Lunes a viernes, 5:00 am Colombia (10:00 UTC). Arranca temprano porque GitHub a veces se retrasa;
    # el robot espera hasta las 5:30 para grabar y termina a las 9:00.
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      prueba_minutos:
        description: "Prueba: minutos a grabar desde ya (vacío = horario normal 5:30 a 9:00)"
        required: false
permissions:
  contents: write
concurrency:
  group: mesas
  cancel-in-progress: false
jobs:
  mesas:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas
        run: python -m pip install pytest && python -m pytest -q
      - name: Grabar y resumir las mesas
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          python -m radar mesas
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRUEBA_MINUTOS: ${{ inputs.prueba_minutos }}
